name: Nix mastery path — every lesson and project on Xubuntu

on:
  push:
    branches: [main]
    paths: ["mastery/**", ".github/workflows/mastery.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mastery
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      courses: ${{ steps.p.outputs.courses }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "courses=$(python3 -c 'import json;print(json.dumps(open("mastery/ci/COURSES").read().split()))')" >> "$GITHUB_OUTPUT"

  course:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        course: ${{ fromJSON(needs.plan.outputs.courses) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - name: Enable KVM (and nested KVM for NixOS VM tests inside the Xubuntu VM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          for m in kvm_intel kvm_amd; do
            [ -e /sys/module/$m/parameters/nested ] && echo "$m nested=$(cat /sys/module/$m/parameters/nested)"
          done
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
      - name: Run course ${{ matrix.course }} in a Xubuntu 26.04 VM
        run: python3 mastery/ci/course_vm.py ${{ matrix.course }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastery-${{ matrix.course }}
          path: results/mastery/${{ matrix.course }}
